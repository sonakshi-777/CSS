        <li>List 4</li>
        <li>List 5</li>
        <li>List 6</li>

    <!-- examples of class selector. Class ek attribute hai isse ham kayi sare syntax ko kisi bhi ek color mein color kr sakte hai -->

    <h5 class="Hello">Hii Anamika</h5>
    <h6 class="Hello"> Hii Sasha</h6>
    <!-- examples of id. id ek attribute hai lekin ye unique hota hai. Ise baar baar use nhi kiya ja sakta -->
    <p id="Bloom">Hii Kukumber</p>

    <!-- example of universal selector. Ye sabhi syntax ko ek sath kisi ek color mein color kr sakta hai -->

    <div>
        <a href="">hii crimson</a>
        <p>hi</p>
        <p>hello</p>
        <p>nice</p>

        <section>
           <p>section wala p </p>
